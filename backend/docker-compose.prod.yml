# Sejahtera Bersama IMS - production
# Bootstrap:  ./deploy/deploy.sh  (first-time local build)
# CI deploy:   APP_IMAGE=ghcr.io/<owner>/sejahtera-ims-api:<sha> ./deploy/deploy-registry.sh
# .env: SECRET_KEY, DEBUG=False, ALLOWED_HOSTS, SQL_*, APP_IMAGE (set after successful registry deploy)
# Edge: Caddy terminates TLS (auto Let's Encrypt) for the API and serves the SPA from ./frontend-releases/current.
# Migrations: applied by API container entrypoint.sh before Gunicorn (deploy scripts do not run migrate).

services:
  redis:
    image: redis:7-alpine
    container_name: ims-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kms-network

  caddy:
    image: caddy:2.11-alpine
    container_name: ims-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@sejahterabersama.my.id}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./frontend-releases:/srv/frontend:ro
      - static_volume:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - kms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/caddy-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${APP_IMAGE:-sejahtera-ims-api:latest}
    container_name: ims-api
    command: ./entrypoint.sh gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${SQL_USER:-postgres}:${SQL_PASSWORD:-}@db:5432/${SQL_DATABASE:-sejahteraims}
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - kms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${APP_IMAGE:-sejahtera-ims-api:latest}
    container_name: ims-celery
    user: "1000:1000"
    command: celery -A backend worker -l info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${SQL_USER:-postgres}:${SQL_PASSWORD:-}@db:5432/${SQL_DATABASE:-sejahteraims}
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - kms-network
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${APP_IMAGE:-sejahtera-ims-api:latest}
    container_name: ims-celery-beat
    user: "1000:1000"
    command: celery -A backend beat -l info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${SQL_USER:-postgres}:${SQL_PASSWORD:-}@db:5432/${SQL_DATABASE:-sejahteraims}
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - kms-network
    healthcheck:
      disable: true

  db:
    image: postgres:15-alpine
    container_name: ims-db
    environment:
      POSTGRES_DB: ${SQL_DATABASE:-sejahteraims}
      POSTGRES_USER: ${SQL_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-postgres} -d ${SQL_DATABASE:-sejahteraims}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_volume:
  static_volume:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  kms-network:
    driver: bridge

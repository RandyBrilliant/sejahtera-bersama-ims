name: Backend — Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sejahtera-ims-api
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Lint, check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-with-sufficient-length-for-django-deploy-check-only
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check --deploy

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

      - name: pip audit
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  build-and-deploy:
    name: Build image & deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Add VPS host key
        run: ssh-keyscan -H -p "${{ secrets.DO_SSH_PORT }}" "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_PATH: ${{ secrets.DO_PROJECT_PATH }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -p "${{ secrets.DO_SSH_PORT }}" "${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }}" bash -s <<EOF
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -d ../.git ] && [ ! -d .git ]; then
            REPO_ROOT="\$(cd .. && pwd)"
          else
            REPO_ROOT="\$PWD"
          fi
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          BEFORE_HEAD="\$(git -C "\$REPO_ROOT" rev-parse HEAD 2>/dev/null || true)"
          git -C "\$REPO_ROOT" config core.fileMode false
          COMPOSE_PATH="docker-compose.prod.yml"
          if [ -f "\$REPO_ROOT/backend/docker-compose.prod.yml" ]; then
            COMPOSE_PATH="backend/docker-compose.prod.yml"
          fi
          if ! git -C "\$REPO_ROOT" diff --quiet -- "\$COMPOSE_PATH" 2>/dev/null; then
            echo "Discarding local edits to \$COMPOSE_PATH (SSL uses docker-compose.prod.ssl.yml)"
            git -C "\$REPO_ROOT" checkout -- "\$COMPOSE_PATH"
          fi
          git -C "\$REPO_ROOT" pull origin main
          AFTER_HEAD="\$(git -C "\$REPO_ROOT" rev-parse HEAD 2>/dev/null || true)"
          CHANGED_FILES="\$(git -C "\$REPO_ROOT" diff --name-only "\$BEFORE_HEAD" "\$AFTER_HEAD" 2>/dev/null || true)"
          chmod +x entrypoint.sh deploy/*.sh deploy/lib/*.sh 2>/dev/null || true
          APP_IMAGE="$APP_IMAGE" CHANGED_FILES="\$CHANGED_FILES" AUTO_DEPLOY=true SKIP_PULL_CODE=true ./deploy/deploy-registry.sh
          docker logout "$REGISTRY" || true
          EOF

      - name: Verify deployment health
        env:
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -p "${{ secrets.DO_SSH_PORT }}" "${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }}" \
            "PROJECT_PATH='${{ secrets.DO_PROJECT_PATH }}' EXPECTED_IMAGE='$EXPECTED_IMAGE' bash -s" << 'EOF'
          set -euo pipefail
          cd "$PROJECT_PATH"
          RUNNING_IMAGE="$(docker inspect ims-api --format '{{.Config.Image}}' 2>/dev/null || true)"
          echo "Running image: ${RUNNING_IMAGE:-unknown}"
          echo "Expected image:  $EXPECTED_IMAGE"
          if [ -z "$RUNNING_IMAGE" ] || [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "Deployed image does not match the commit image — deploy did not apply."
            exit 1
          fi
          PORT="$(grep -E '^PORT=' .env 2>/dev/null | head -n1 | cut -d= -f2 | tr -d '\r' || true)"
          PORT="${PORT:-8000}"
          for i in $(seq 1 6); do
            if curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health/" 2>/dev/null \
              | grep -qE '"success"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health check passed (host)"
              exit 0
            fi
            if docker compose --env-file .env -f docker-compose.prod.yml exec -T api \
              curl -fsS --max-time 5 "http://localhost:${PORT}/health/" 2>/dev/null \
              | grep -qE '"success"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health check passed (container)"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy"
          exit 1
          EOF
